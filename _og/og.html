<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
  *{box-sizing:border-box; margin:0}
  html,body{width:1200px; height:630px; overflow:hidden}
  body{background:#0a2a50; color:#f2f8ff;
       font-family:"IBM Plex Mono",monospace; position:relative}
  .grid{position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg,#12406e 0 1px,transparent 1px 40px),
      repeating-linear-gradient(90deg,#12406e 0 1px,transparent 1px 40px);
    opacity:.55}
  .frame{position:absolute; inset:36px; border:1px solid #265f95}
  .in{position:absolute; inset:36px; display:flex; align-items:center;
      justify-content:space-between; padding:0 72px; gap:56px}
  h1{font-size:132px; font-weight:700; letter-spacing:-.035em; line-height:.9}
  p{margin-top:26px; font-size:21px; line-height:1.6; color:#b3d4ee;
    max-width:21em}
  .meta{margin-top:34px; font-size:16px; letter-spacing:.14em; color:#7ba7cc}
  svg{width:300px; height:300px; flex:0 0 auto}
  .l{fill:none; stroke:#265f95; stroke-width:1.2}
  .f{fill:none; stroke:#7ba7cc; stroke-width:1.2}
  .h{fill:none; stroke:#ffe0a0; stroke-width:1.8}
  .j{fill:none; stroke:#ffe0a0; stroke-width:1.2}
</style></head><body>
<div class="grid"></div><div class="frame"></div>
<div class="in">
  <div>
    <h1>krukah</h1>
    <p>Markets, software, physics, game theory, film, and whatever else is open on my desk.</p>
    <div class="meta">KELECHI ROCK UKAH &nbsp;·&nbsp; FOUNDER AND CTO AT NOVIG</div>
  </div>
  <svg viewBox="0 0 120 120">
    <circle class="l" cx="60" cy="60" r="52"/>
    <circle class="f" cx="60" cy="60" r="40" stroke-dasharray="5 4.5"/>
    <circle class="f" cx="60" cy="60" r="28" stroke-dasharray="3.5 3.6"/>
    <circle class="l" cx="60" cy="60" r="14"/>
    <path class="h" d="M60 60 C73 46 83 30 88 12"/>
    <path class="h" d="M60 60 Q35 70 15 90"/>
    <path class="j" d="M60 60 Q38 65 19 75"/>
    <path class="j" d="M60 60 Q40 76 26 94"/>
    <path class="j" d="M60 60 Q52 76 41 90"/>
    <circle cx="60" cy="60" r="2.6" fill="#ffe0a0"/>
  </svg>
</div></body></html>
