---
layout: default
---
{%- if page.register %}<div class="field" aria-hidden="true"></div>{% endif %}
<div class="wrap">
  {%- if page.plate %}
  <header class="post__head{% if page.register %} post__head--reg{% endif %}">
    {% include plate.html name=page.plate scale='lg' %}
    <div>
      <h1 class="post__title">{{ page.title }}</h1>
      {%- if page.lead %}
      <p class="post__sub">{{ page.lead }}</p>
      {%- endif %}
    </div>
  </header>
  {%- else %}
  <header class="page__head">
    <h1 class="page__title">{{ page.title }}</h1>
  </header>
  {%- endif %}
  <article class="prose{% if page.register %} prose--reg{% endif %}">
    {{ content }}
  </article>
</div>
