<header class="top">
  <div class="wrap">
    <span class="top__me"><a href="{{ '/' | relative_url }}">kelechi rock ukah</a></span>
    <nav aria-label="Sections">
      <a href="{{ '/#projects' | relative_url }}">projects</a>
      <a href="{{ '/#writing' | relative_url }}">writing</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} aria-current="page"{% endif %}>about</a>
      <a href="https://github.com/{{ site.github_user }}">code</a>
      <button type="button" class="top__flip" id="flip" aria-pressed="false"
              aria-label="Invert the print" title="Invert the print">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor"
                  stroke-width="1.2"/>
          <path d="M8 1.6 A6.4 6.4 0 0 1 8 14.4 Z" fill="currentColor"/>
        </svg>
      </button>
    </nav>
  </div>
