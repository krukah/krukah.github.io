<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.url == "/" -%}
    {%- assign doc_title = site.title -%}
  {%- else -%}
    {%- assign doc_title = page.title | append: " · " | append: site.title -%}
  {%- endif -%}
  {%- assign doc_desc = page.description | default: site.description | strip_newlines -%}
  <title>{{ doc_title }}</title>
  <meta name="description" content="{{ doc_desc }}">
  <meta name="author" content="{{ site.author }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">

  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ doc_desc }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/og.png' | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ '/assets/og.png' | absolute_url }}">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a2a50'/><circle cx='50' cy='50' r='33' fill='none' stroke='%233a76b0' stroke-width='5'/><circle cx='50' cy='50' r='17' fill='none' stroke='%237ba7cc' stroke-width='5'/><circle cx='50' cy='50' r='6' fill='%23ffe0a0'/></svg>">
  <meta name="theme-color" content="#0a2a50" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)">

  <script>
    /* Stamp the theme before the stylesheet paints, so there is no flash. A
       saved choice wins; otherwise follow the operating system. */
    (function(){
      try{
        var saved = localStorage.getItem('krukah-theme');
        var light = saved
          ? saved === 'light'
          : window.matchMedia('(prefers-color-scheme: light)').matches;
        if (light) document.documentElement.setAttribute('data-theme','light');
      }catch(e){}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
